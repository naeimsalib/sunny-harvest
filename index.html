<title>Sunny Harvest 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* =====================================================================
   SUNNY HARVEST 3D — full Three.js world.
   Every model is built in code from primitives (no external assets).
   Fixed 45° camera follows the farmer. Game logic = verified v3 chain.
   ===================================================================== */
:root{
  --cream:#fff8ec; --card:#ffffff; --sun:#ffd44d; --sun2:#ffb930; --coin:#f5a623;
  --wood:#b07b45; --wood2:#8f5f30; --text:#4a3b2a; --text2:#8a7a64;
  --green-btn:#5cbf4f; --green-btn2:#43a637; --purple:#a06be0;
  --shadow:0 4px 0 rgba(0,0,0,0.10); --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:'Baloo 2','Comic Sans MS','Segoe UI',system-ui,sans-serif;
  background:#aee1ff;color:var(--text);}
#app{max-width:520px;height:100%;margin:0 auto;position:relative;overflow:hidden;}
/* the 3D world IS the screen; HUD floats over it */
#sceneWrap{position:absolute;inset:0;}
#topHUD{position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:10px;background:linear-gradient(rgba(70,52,26,0.24),transparent);}
#topHUD .task,#topHUD #coinBox,#topHUD #levelBadge,#topHUD #lvlBarWrap{pointer-events:auto;}
#bottomHUD{position:absolute;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:14px;background:linear-gradient(transparent,rgba(70,52,26,0.30));}
#bottomHUD .rw,#bottomHUD .upg{pointer-events:auto;}

#header{padding:8px 12px 2px;}
#topRow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#levelBadge{background:linear-gradient(var(--wood),var(--wood2));border-radius:14px;padding:6px 13px;
  box-shadow:0 4px 0 #6e4a25, inset 0 2px 0 rgba(255,255,255,0.25);
  font-weight:800;font-size:13px;color:#fff4e0;text-shadow:0 1px 0 rgba(0,0,0,0.25);border:2px solid #7d5329;}
#coinBox{background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);border-radius:16px;padding:4px 12px 4px 7px;box-shadow:var(--shadow);
  font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
#lvlBarWrap{margin-top:5px;background:rgba(255,255,255,0.90);backdrop-filter:blur(6px);border-radius:12px;padding:4px 10px;box-shadow:var(--shadow);}
#lvlBarLabel{font-size:10px;font-weight:800;color:var(--text2);display:flex;justify-content:space-between;}
#lvlBar{height:9px;background:#efe5d2;border-radius:6px;margin-top:3px;overflow:hidden;}
#lvlFill{height:100%;width:0%;background:linear-gradient(90deg,var(--sun),var(--sun2));border-radius:6px;transition:width .4s;}

#taskStrip{display:flex;gap:6px;padding:6px 12px 3px;}
.task{flex:1;background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);border-radius:13px;padding:6px 7px 5px;
  box-shadow:0 3px 0 #cfe3bd;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;
  animation:taskSlide .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes taskSlide{from{transform:translateY(-18px) scale(.85);opacity:0;}to{transform:none;opacity:1;}}
.task .tTitle{font-size:10px;font-weight:800;line-height:1.15;display:flex;gap:4px;align-items:flex-start;}
.task .tIcon{font-size:13px;line-height:1;}
.task .tBar{height:7px;background:#e5ddc9;border-radius:4px;overflow:hidden;}
.task .tFill{height:100%;background:linear-gradient(90deg,#7cc94f,#5cbf4f);border-radius:4px;width:0%;transition:width .3s;}
.task .tNums{font-size:9px;font-weight:800;color:var(--text2);text-align:right;}
.task.done{background:linear-gradient(#fffbe8,#fff3c8);animation:taskGlow 1.2s ease-in-out infinite;}
@keyframes taskGlow{0%,100%{box-shadow:0 3px 0 #e8ce8a;}50%{box-shadow:0 3px 0 #e8ce8a,0 0 14px rgba(255,212,77,0.9);}}
.task .claimRow{display:flex;gap:4px;}
.claimBtn{flex:1;border:none;border-radius:9px;padding:4px 2px;font-family:inherit;font-weight:800;
  font-size:9.5px;cursor:pointer;color:#fff;background:linear-gradient(var(--green-btn),var(--green-btn2));box-shadow:0 2px 0 #35872b;}
.claimBtn.x2{background:linear-gradient(#b47ff0,var(--purple));box-shadow:0 2px 0 #7a4fb0;}
.claimBtn:active{transform:translateY(1px);}

#boostRow{display:flex;gap:6px;padding:0 12px;min-height:0;flex-wrap:wrap;}
.chip{background:var(--card);border-radius:11px;padding:1px 9px;font-size:10.5px;font-weight:800;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;animation:chipIn .3s;}
@keyframes chipIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.chip.boost{color:#e88a00;}.chip.bot{color:#7a4fd0;}

/* 3D viewport */
#threeCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#joyRing{position:absolute;width:96px;height:96px;border-radius:50%;z-index:40;display:none;
  background:rgba(255,255,255,0.22);border:3px solid rgba(255,255,255,0.75);
  box-shadow:0 3px 10px rgba(0,0,0,0.12), inset 0 0 14px rgba(255,255,255,0.35);
  pointer-events:none;transform:translate(-50%,-50%);}
#joyNub{position:absolute;width:44px;height:44px;border-radius:50%;z-index:41;display:none;
  background:radial-gradient(circle at 35% 30%, #ffe58a, var(--sun2));
  border:3px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,0.2);
  pointer-events:none;transform:translate(-50%,-50%);}
#farmerBubble{position:absolute;z-index:42;background:#fff;border-radius:10px;padding:3px 9px;
  font-size:11px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;
  opacity:0;transition:opacity .3s;transform:translate(-50%,-100%);pointer-events:none;}
#farmerBubble.show{opacity:1;}

#verTag{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 4px);z-index:21;
  font-size:9px;font-weight:800;color:rgba(255,255,255,0.75);
  text-shadow:0 1px 2px rgba(0,0,0,0.35);pointer-events:none;}
#miniMap{padding:0 12px 4px;display:flex;justify-content:flex-start;}
.mmTrack{position:relative;height:34px;width:52%;background:rgba(216,240,190,0.88);backdrop-filter:blur(4px);
  border-radius:11px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.10), 0 2px 0 rgba(255,255,255,0.5);
  border:2px solid rgba(255,253,245,0.9);}
.mmIcon{position:absolute;transform:translate(-50%,-50%);font-size:11px;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,0.15));pointer-events:none;}
.mmIcon.lock{filter:grayscale(1) opacity(0.5);}
#mmDot{position:absolute;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ffe58a,var(--sun2));
  border:2px solid #fff;box-shadow:0 0 6px rgba(255,185,48,0.9);pointer-events:none;}

#rewardsBar{display:flex;gap:6px;padding:0 12px 4px;}
.rw{flex:1;background:rgba(255,250,238,0.92);backdrop-filter:blur(6px);border:none;border-radius:13px;padding:4px 4px 4px;
  box-shadow:0 4px 0 #e3c68f;cursor:pointer;font-family:inherit;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s;position:relative;}
.rw:active{transform:translateY(2px);}
.rw .rwIcon{font-size:16px;line-height:1;}
.rw .rwName{font-size:8.5px;font-weight:800;line-height:1.05;text-align:center;}
.rw .rwSub{font-size:8px;font-weight:800;color:#e88a00;}
.rw .adTag{position:absolute;top:-6px;right:-3px;background:var(--purple);color:#fff;font-size:7px;
  font-weight:800;border-radius:6px;padding:1.5px 5px;box-shadow:0 2px 0 #7a4fb0;}
.rw.cool{filter:grayscale(0.9);opacity:.6;}
.rw.cool .adTag{background:#999;box-shadow:0 2px 0 #777;}

#shop{padding:0 12px 9px;}
#shopTitle{font-size:10px;font-weight:800;color:#fff4e0;text-shadow:0 1px 2px rgba(80,60,30,0.5);margin:0 0 3px 4px;letter-spacing:.6px;}
#upgrades{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.upg{background:rgba(255,251,242,0.93);backdrop-filter:blur(6px);border:none;border-radius:15px;padding:6px 9px;
  box-shadow:0 4px 0 #d9cbb0;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;
  font-family:inherit;color:var(--text);transition:transform .08s;}
.upg:active{transform:translateY(2px);}
.upg .icon{width:32px;height:32px;flex:0 0 32px;background:var(--cream);border-radius:11px;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 3px rgba(0,0,0,0.06);
  font-size:19px;}
.upg .info{flex:1;min-width:0;}
.upg .name{font-weight:800;font-size:12px;line-height:1.1;}
.upg .lvl{font-size:9px;color:var(--text2);font-weight:800;}
.upg .cost{font-weight:800;font-size:12px;color:var(--coin);display:flex;align-items:center;gap:3px;white-space:nowrap;}
.upg.cant{opacity:.55;}
.upg.maxed .cost{color:var(--green-btn);}

<body>
<div id="app">
  <div id="sceneWrap">

<script>
/* =====================================================================
   CONFIG — identical to the flow-verified economy.
   ===================================================================== */
const FARM = {
  crops:["carrot","tomato","sunflower"], cropValue:[5,12,30], growTime:6,
  costs:{ plot:{base:50,mult:2.3,max:6}, speed:{base:45,mult:2.0,max:5},
          seeds:{base:200,mult:5.0}, auto:{base:350,mult:2.8,max:3} },
  startPlots:2, maxPlots:6
};
const MEADOW = {
  unlockCost: 6000, woolBase: 60, woolTime: 25,
  costs:{ sheep:{base:1800, mult:2.0, max:5}, wool:{base:3000, mult:2.6, max:4},
          shear:{base:3500, mult:2.4, max:3} }
};
const OFFLINE_RATE=0.45, OFFLINE_CAP_H=6, TASKS_PER_LEVEL=4;
const CROP_NAMES={carrot:'Carrot',tomato:'Tomato',sunflower:'Sunflower'};

const TASK_CHAIN = [
  { id:'t1',  icon:'🥕', title:'Harvest 5 crops',            type:'counter', ev:'harvest', n:5,   rMin:1.0 },
  { id:'t2',  icon:'🟫', title:'Own 3 plots',                type:'state',   check:s=>s.unlockedPlots>=3, rMin:1.2 },
  { id:'t3',  icon:'💰', title:'Collect 250 coins',          type:'counter', ev:'coins',   n:250, rMin:1.2 },
  { id:'t4',  icon:'🍅', title:'Unlock Tomatoes',            type:'state',   check:s=>s.cropTier>=1, rMin:1.5 },
  { id:'t5',  icon:'🧺', title:'Harvest 15 crops',           type:'counter', ev:'harvest', n:15,  rMin:1.5 },
  { id:'t6',  icon:'📺', title:'Watch 1 ad reward',          type:'counter', ev:'ad',      n:1,   rMin:2.0 },
  { id:'t7',  icon:'🟫', title:'Own 4 plots',                type:'state',   check:s=>s.unlockedPlots>=4, rMin:1.5 },
  { id:'t8',  icon:'⏱️', title:'Buy Faster Growth Lv 2',     type:'state',   check:s=>s.upgLevels.speed>=2, rMin:1.5 },
  { id:'t9',  icon:'💰', title:'Collect 1,800 coins',        type:'counter', ev:'coins',   n:1800, rMin:1.8 },
  { id:'t10', icon:'🌻', title:'Unlock Sunflowers',          type:'state',   check:s=>s.cropTier>=2, rMin:2.0 },
  { id:'t11', icon:'🤖', title:'Buy the Harvest Bot',        type:'state',   check:s=>s.upgLevels.auto>=1, rMin:2.0 },
  { id:'t12', icon:'📺', title:'Watch 2 ad rewards',         type:'counter', ev:'ad',      n:2,   rMin:2.5 },
  { id:'t13', icon:'🟫', title:'Fill the farm — 6 plots',    type:'state',   check:s=>s.unlockedPlots>=6, rMin:2.5 },
  { id:'t14', icon:'💰', title:'Collect 7,000 coins',        type:'counter', ev:'coins',   n:7000, rMin:2.5 },
  { id:'t15', icon:'🐑', title:'Unlock the Meadow!',         type:'state',   check:s=>s.meadowOpen, rMin:3.0 },
  { id:'t16', icon:'🐑', title:'Buy your first sheep',       type:'state',   check:s=>s.sheep.length>=1, rMin:2.0 },
  { id:'t17', icon:'🧶', title:'Collect 10 wool',            type:'counter', ev:'wool',    n:10,  rMin:2.0 },
  { id:'t18', icon:'🐑', title:'Grow the flock — 3 sheep',   type:'state',   check:s=>s.sheep.length>=3, rMin:2.5 },
  { id:'t19', icon:'📺', title:'Watch 3 ad rewards',         type:'counter', ev:'ad',      n:3,   rMin:3.0 },
  { id:'t20', icon:'🧶', title:'Collect 30 wool',            type:'counter', ev:'wool',    n:30,  rMin:2.5 },
  { id:'t21', icon:'✨', title:'Upgrade Wool Quality',       type:'state',   check:s=>s.meadowLv.wool>=1, rMin:2.5 },
  { id:'t22', icon:'💰', title:'Collect 30,000 coins',       type:'counter', ev:'coins',   n:30000, rMin:3.0 },
  { id:'t23', icon:'🐑', title:'Full flock — 5 sheep',       type:'state',   check:s=>s.sheep.length>=5, rMin:3.0 },
  { id:'t24', icon:'🧺', title:'Harvest 90 crops',           type:'counter', ev:'harvest', n:90,  rMin:3.0 }
];
function generatedTask(i){
  const k=i-TASK_CHAIN.length;
  const cycle=['coins','harvest','wool','ad'][k%4];
  const scale=Math.pow(2.1, Math.floor(k/4)+1);
  if(cycle==='coins')  return {id:'g'+k, icon:'💰', title:'Collect '+fmt(Math.round(40000*scale))+' coins', type:'counter', ev:'coins', n:Math.round(40000*scale), rMin:3.5};
  if(cycle==='harvest')return {id:'g'+k, icon:'🧺', title:'Harvest '+Math.round(70*Math.sqrt(scale))+' crops', type:'counter', ev:'harvest', n:Math.round(70*Math.sqrt(scale)), rMin:3.0};
  if(cycle==='wool')   return {id:'g'+k, icon:'🧶', title:'Collect '+Math.round(25*Math.sqrt(scale))+' wool', type:'counter', ev:'wool', n:Math.round(25*Math.sqrt(scale)), rMin:3.0};
  return {id:'g'+k, icon:'📺', title:'Watch 3 ad rewards', type:'counter', ev:'ad', n:3, rMin:3.5};
}
function taskAt(i){ return i<TASK_CHAIN.length ? TASK_CHAIN[i] : generatedTask(i); }

const AD_DEFS = {
  rush:  { icon:'💰', name:'Coin Rush',  cd:5*60, cap:10, desc:()=>fmt(rushAmount())+' now!' },
  boost: { icon:'☀️', name:'Sun Boost',  cd:6*60, cap:8,  desc:()=>'2× grow · 5 min' },
  bot:   { icon:'🤖', name:'Super Bot',  cd:8*60, cap:8,  desc:()=>'Auto 3 min' },
  wool:  { icon:'🧶', name:'Insta-Wool', cd:6*60, cap:8,  desc:()=>'All wool now!' }
};

/* =====================================================================
   STATE / ECONOMY (identical logic; + saved farmer position)
   ===================================================================== */
const $=s=>document.querySelector(s);
const now=()=>Date.now();
let S;
const Store={
  ok:(()=>{try{localStorage.setItem('__sh_t','1');localStorage.removeItem('__sh_t');return true;}catch(e){return false;}})(),
  mem:{},
  get(k){if(this.ok){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}return this.mem[k]??null;},
  set(k,v){if(this.ok){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}else{this.mem[k]=v;}}
};
// World: 120 x 80 units. Central hub (fresh spawn) at the path junction.
const WORLD={w:120,h:80};
const SPAWN={x:0,z:6};
const ZONES=[
  {name:'farm',   cx:-38, cz:14, hx:14, hz:12},
  {name:'meadow', cx:  0, cz:-16, hx:14, hz:11},
  {name:'build',  cx: 40, cz:12, hx:11, hz:9}
];
function newState(){
  return {
    coins:0, farmLevel:1, tasksDone:0, taskIdx:[0,1,2], taskProg:{},
    plots:Array.from({length:FARM.maxPlots},()=>({progress:0,ready:false})),
    unlockedPlots:FARM.startPlots, cropTier:0,
    upgLevels:{plot:0,speed:0,seeds:0,auto:0},
    meadowOpen:false, sheep:[], meadowLv:{wool:0,shear:0},
    autoTimer:0, boostUntil:0, superBotUntil:0,
    adLast:{}, adCount:{day:dayKey()}, zone:0,
    pos:{x:SPAWN.x, z:SPAWN.z},              // saved character position
    lastSeen:now()
  };
}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function efficiency(){return Math.min(0.95,0.75+S.upgLevels.auto*0.05+(superBotOn()?0.15:0));}
function growTime(){return FARM.growTime*Math.pow(0.88,S.upgLevels.speed)*(boostOn()?0.5:1);}
function cropValue(){return FARM.cropValue[S.cropTier];}
function woolValue(){return Math.round(MEADOW.woolBase*Math.pow(1.5,S.meadowLv.wool));}
function woolTime(){return MEADOW.woolTime*Math.pow(0.85,S.meadowLv.shear);}
function farmEPS(){return S.unlockedPlots*cropValue()/growTime()*efficiency();}
function meadowEPS(){return S.sheep.length*woolValue()/woolTime()*0.85;}
function eps(){return farmEPS()+(S.meadowOpen?meadowEPS():0);}
function rushAmount(){return Math.max(20,Math.round(eps()*8*60/10)*10);}
function boostOn(){return now()<S.boostUntil;}
function superBotOn(){return now()<S.superBotUntil;}
function upgCost(key){const c=FARM.costs[key];return Math.round(c.base*Math.pow(c.mult,S.upgLevels[key]));}
function meadowCost(key){const c=MEADOW.costs[key];const lv=key==='sheep'?S.sheep.length:S.meadowLv[key];return Math.round(c.base*Math.pow(c.mult,lv));}

/* ===================== TASK ENGINE (identical) ===================== */
function activeTasks(){return S.taskIdx.map(i=>({i,def:taskAt(i)}));}
function taskEvent(ev,n=1){
  let touched=false;
  activeTasks().forEach(({def})=>{
    if(def.type==='counter'&&def.ev===ev&&!taskComplete(def)){
      S.taskProg[def.id]=(S.taskProg[def.id]||0)+n; touched=true;
    }
  });
  if(touched) renderTasks();
}
function taskProgress(def){ return def.type==='counter'?Math.min(def.n,S.taskProg[def.id]||0):(def.check(S)?1:0); }
function taskTarget(def){ return def.type==='counter'?def.n:1; }
function taskComplete(def){ return taskProgress(def)>=taskTarget(def); }
function taskReward(def){ return Math.max(15, Math.round(eps()*def.rMin*20/5)*5); }

function claimTask(slot,mult){
  const {def}=activeTasks()[slot];
  if(!taskComplete(def)) return;
  const reward=taskReward(def)*mult;
  S.coins+=reward;
  taskEvent('coins',reward);
  coinFountain(innerWidth/2, 170, mult===2?10:6);
  popText(innerWidth/2, 150, '+'+fmt(reward)+' 💰', '#f5a623');
  bump($('#coinBox'));
  farmerCheer();
  chirp(523,'triangle',0.1); setTimeout(()=>chirp(784,'triangle',0.1),120);
  S.taskIdx[slot]=Math.max(...S.taskIdx)+1;
  S.tasksDone++;
  if(S.tasksDone%TASKS_PER_LEVEL===0) farmLevelUp();
  renderAll(); save();
}
function farmLevelUp(){
  S.farmLevel++;
  fireworks(); flash();
  chirp(659,'triangle',0.1); setTimeout(()=>chirp(880,'triangle',0.11),140); setTimeout(()=>chirp(1046,'triangle',0.12),280);
  const bonus=Math.max(50,Math.round(eps()*120/10)*10);
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="panel">
    <h1>Farm Level ${S.farmLevel}! 🎉</h1>
    <h2>Your farm business is growing!</h2>
    <div style="font-size:40px;margin:2px 0;">🏅</div>
    <div style="font-size:22px;font-weight:800;color:var(--coin);margin-bottom:6px;">Bonus +${fmt(bonus)}</div>
    <button class="bigBtn adBtn" id="lvlX2">📺 Watch Ad — Collect ×2</button>
    <button class="softBtn" id="lvlOk">Collect +${fmt(bonus)}</button>
  </div>`;
  document.body.appendChild(ov);
  const grant=m=>{ov.remove();S.coins+=bonus*m;taskEvent('coins',bonus*m);bump($('#coinBox'));renderAll();save();};
  ov.querySelector('#lvlX2').addEventListener('pointerdown',()=>AdManager.show(()=>{registerAdWatch();grant(2);}));
  ov.querySelector('#lvlOk').addEventListener('pointerdown',()=>grant(1));
}

/* ===================== AD MANAGER (identical) ===================== */
const AdManager={
  busy:false,
  show(onReward){
    if(this.busy)return;
    this.busy=true;
    const screen=$('#adScreen'),ring=$('#adCountRing'),num=$('#adCount');
    screen.style.display='flex';
    let t=5;num.textContent=t;ring.style.setProperty('--pct','0%');
    const iv=setInterval(()=>{
      t--;num.textContent=Math.max(0,t);
      ring.style.setProperty('--pct',((5-t)/5*100)+'%');
      if(t<=0){clearInterval(iv);screen.style.display='none';this.busy=false;onReward();}
    },1000);
  }
};
function registerAdWatch(){ taskEvent('ad',1); }
function adReady(key){
  const d=AD_DEFS[key];
  const cooled=(now()-(S.adLast[key]||0))/1000>=d.cd;
  const underCap=(S.adCount[key]||0)<d.cap;
  const relevant=key!=='wool'||(S.meadowOpen&&S.sheep.length>0);
  return cooled&&underCap&&relevant;
}
function tryAdReward(key,btn){
  if(!adReady(key)){shake(btn);return;}
  AdManager.show(()=>{
    S.adLast[key]=now();S.adCount[key]=(S.adCount[key]||0)+1;
    registerAdWatch();
    if(key==='rush'){const amt=rushAmount();S.coins+=amt;taskEvent('coins',amt);
      coinFountain(innerWidth/2,innerHeight/2,12);
      popText(innerWidth/2,innerHeight/2,'+'+fmt(amt)+' 💰','#f5a623');bump($('#coinBox'));}
    if(key==='boost'){S.boostUntil=now()+5*60*1000;}
    if(key==='bot'){S.superBotUntil=now()+3*60*1000;}
    if(key==='wool'){S.sheep.forEach(sh=>{sh.progress=1;sh.ready=true;});}
    chirp(523,'triangle',0.1);setTimeout(()=>chirp(784,'triangle',0.1),120);
    renderAll();save();
  });
}

/* ===================== SAVE / OFFLINE (+ position) ===================== */
function save(){
  if(S){
    S.lastSeen=now();
    if(FarmerRig){ S.pos={x:+FarmerRig.root.position.x.toFixed(2), z:+FarmerRig.root.position.z.toFixed(2)}; }
    Store.set('sunny_save_3d',S);
  }
}
function load(){
  const raw=Store.get('sunny_save_3d');
  if(raw&&Array.isArray(raw.taskIdx)){
    S=Object.assign(newState(),raw);
    if(!Array.isArray(S.plots)||S.plots.length!==FARM.maxPlots)
      S.plots=Array.from({length:FARM.maxPlots},()=>({progress:0,ready:false}));
    if(!S.pos||typeof S.pos.x!=='number') S.pos={x:SPAWN.x,z:SPAWN.z};
    if(S.adCount.day!==dayKey())S.adCount={day:dayKey()};
    return true;
  }
  return false;
}
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('beforeunload',save);

function offlineWelcome(){
  const away=Math.max(0,(now()-(S.lastSeen||now()))/1000);
  if(away<60)return;
  const capped=Math.min(away,OFFLINE_CAP_H*3600);
  const amount=Math.round(eps()*OFFLINE_RATE*capped);
  if(amount<5)return;
  const hh=Math.floor(capped/3600),mm=Math.floor((capped%3600)/60);
  const hitCap=away>=OFFLINE_CAP_H*3600;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="panel">
    <h1>Welcome back! 🌻</h1>
    <h2>Your farm kept working while you were away${hitCap?' (max '+OFFLINE_CAP_H+'h reached!)':''}</h2>
    <div style="font-size:40px;margin:4px 0 2px;">💰</div>
    <div style="font-size:26px;font-weight:800;color:var(--coin);margin-bottom:8px;">+${fmt(amount)}</div>
    <div class="statRow"><span>Time away</span><b>${hh>0?hh+'h ':''}${mm}m</b></div>
    <button class="bigBtn adBtn" id="dblBtn">📺 Watch Ad — Collect ×2 (+${fmt(amount*2)})</button>
    <button class="softBtn" id="colBtn">Collect +${fmt(amount)}</button>
  </div>`;
  document.body.appendChild(ov);
  const grant=m=>{ov.remove();S.coins+=amount*m;taskEvent('coins',amount*m);
    coinFountain(innerWidth/2,innerHeight/2,10);
    bump($('#coinBox'));chirp(660);setTimeout(()=>chirp(880),100);renderAll();save();};
  ov.querySelector('#dblBtn').addEventListener('pointerdown',()=>AdManager.show(()=>{registerAdWatch();grant(2);}));
  ov.querySelector('#colBtn').addEventListener('pointerdown',()=>grant(1));
}

/* =====================================================================
   ██ THREE.JS 3D WORLD — everything modeled from primitives, in code ██
   ===================================================================== */
let renderer, scene, camera, ray=new THREE.Raycaster(), tapV=new THREE.Vector2();
let FarmerRig=null, plots3D=[], sheep3D=[], readySheepMarkers=[];
let clouds3D=[], butterflies=[], bot3D=null;
const M = (c,extra={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},extra));

function initThree(){
  const canvas=$('#threeCanvas'), wrap=$('#sceneWrap');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;   // filmic grade = rich, not washed out
  renderer.toneMappingExposure=0.86;
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8ec8ea);
  scene.fog=new THREE.Fog(0x8ec8ea, 78, 150);

  camera=new THREE.PerspectiveCamera(42,1,0.1,320);

  const hemi=new THREE.HemisphereLight(0xdce8f2,0x40632a,0.42);
  scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffeccb,0.95);
  sun.position.set(-30,52,20);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.bias=-0.0004;
  sun.shadow.normalBias=0.03;      // stops shadow-acne flicker on curved limbs
  const sc=sun.shadow.camera;
  sc.left=-70; sc.right=70; sc.top=70; sc.bottom=-70; sc.far=160;
  scene.add(sun);

  resize();
  window.addEventListener('resize',resize);
  function resize(){
    const w=wrap.clientWidth,h=wrap.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
}

/* ---- procedural ground texture: grass stripes + dirt path + ponds ---- */
function makeGroundTexture(){
  const cv=document.createElement('canvas'); cv.width=2048; cv.height=1366;
  const g=cv.getContext('2d');
  const X=x=>(x/WORLD.w+0.5)*cv.width, Y=z=>(z/WORLD.h+0.5)*cv.height;
  // rich meadow base
  g.fillStyle='#6a9f45'; g.fillRect(0,0,cv.width,cv.height);
  // soft mow stripes
  g.globalAlpha=0.16; g.fillStyle='#5b8c39';
  for(let i=-10;i<22;i++){ g.save(); g.translate(i*150,0); g.rotate(0.5);
    g.fillRect(0,-800,58,3200); g.restore(); }
  // scattered light patches for organic feel
  g.globalAlpha=0.09; g.fillStyle='#7aae52';
  for(let i=0;i<40;i++){ g.beginPath();
    g.ellipse(Math.random()*cv.width,Math.random()*cv.height,60+Math.random()*90,40+Math.random()*60,Math.random()*3,0,7); g.fill(); }
  g.globalAlpha=1;
  // ponds with sandy rim
  const pond=(x,z,rx,rz)=>{
    g.fillStyle='#e6cf9a'; g.beginPath(); g.ellipse(X(x),Y(z),rx+14,rz+11,0,0,7); g.fill();
    g.fillStyle='#4791bd'; g.beginPath(); g.ellipse(X(x),Y(z),rx,rz,0,0,7); g.fill();
    g.fillStyle='#5fa8ce'; g.beginPath(); g.ellipse(X(x),Y(z)-4,rx*0.84,rz*0.8,0,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,0.5)'; g.beginPath(); g.ellipse(X(x)-rx*0.25,Y(z)-rz*0.3,rx*0.3,rz*0.15,0,0,7); g.fill(); };
  pond(-16,-30,110,58); pond(30,-26,80,46);
  // dirt paths with darker edging so they READ
  const path=(x1,z1,x2,z2,cx,czz)=>{ g.beginPath(); g.moveTo(X(x1),Y(z1));
    g.quadraticCurveTo(X(cx),Y(czz),X(x2),Y(z2)); g.stroke(); };
  g.lineCap='round';
  g.strokeStyle='#9c7343'; g.lineWidth=72;
  path(SPAWN.x,SPAWN.z, ZONES[0].cx+8, ZONES[0].cz, -16, 22);
  path(SPAWN.x,SPAWN.z, ZONES[1].cx, ZONES[1].cz+8, 2, -4);
  path(SPAWN.x,SPAWN.z, ZONES[2].cx-7, ZONES[2].cz, 20, 18);
  g.strokeStyle='#bd9159'; g.lineWidth=58;
  path(SPAWN.x,SPAWN.z, ZONES[0].cx+8, ZONES[0].cz, -16, 22);
  path(SPAWN.x,SPAWN.z, ZONES[1].cx, ZONES[1].cz+8, 2, -4);
  path(SPAWN.x,SPAWN.z, ZONES[2].cx-7, ZONES[2].cz, 20, 18);
  g.strokeStyle='#ac7f4c'; g.setLineDash([7,74]); g.lineWidth=58;
  path(SPAWN.x,SPAWN.z, ZONES[0].cx+8, ZONES[0].cz, -16, 22);
  path(SPAWN.x,SPAWN.z, ZONES[1].cx, ZONES[1].cz+8, 2, -4);
  path(SPAWN.x,SPAWN.z, ZONES[2].cx-7, ZONES[2].cz, 20, 18);
  g.setLineDash([]);
  // hub plaza: stone circle
  g.fillStyle='#9c7343'; g.beginPath(); g.ellipse(X(SPAWN.x),Y(SPAWN.z),96,60,0,0,7); g.fill();
  g.fillStyle='#bd9159'; g.beginPath(); g.ellipse(X(SPAWN.x),Y(SPAWN.z),82,50,0,0,7); g.fill();
  g.fillStyle='#cda471'; g.beginPath(); g.ellipse(X(SPAWN.x),Y(SPAWN.z),40,25,0,0,7); g.fill();
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=8;
  return tex;
}

/* ---- text sign sprite (procedural canvas → texture) ---- */
function makeSign(text){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=96;
  const g=cv.getContext('2d');
  g.fillStyle='#8f5f30'; roundRect(g,8,14,240,64,16); g.fill();
  g.fillStyle='#b07b45'; roundRect(g,14,20,228,52,12); g.fill();
  g.fillStyle='#fff4e0'; g.font='800 34px "Baloo 2", sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text,128,48);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sp.scale.set(5.6,2.1,1);
  return sp;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---- crops: 3 crops × growing scale + ready form, all primitives ---- */
function makeCrop(kind){
  const g=new THREE.Group();
  if(kind==='carrot'){
    const top=new THREE.Mesh(new THREE.ConeGeometry(0.34,0.7,7),M(0x7ec850));
    top.position.y=0.55; g.add(top);
    const top2=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.55,6),M(0x8fd15f));
    top2.position.set(0.22,0.45,0.05); top2.rotation.z=-0.4; g.add(top2);
    const root=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.55,7),M(0xff8b3d));
    root.rotation.x=Math.PI; root.position.y=0.12; g.add(root);
  }else if(kind==='tomato'){
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,1.0,6),M(0x6db843));
    stem.position.y=0.5; g.add(stem);
    [[0.25,0.55,0.1],[-0.24,0.7,-0.05],[0.02,0.95,0.12]].forEach(p=>{
      const t=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,7),M(0xff5a4e));
      t.position.set(p[0],p[1],p[2]); t.castShadow=true; g.add(t);
    });
  }else{ // sunflower
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,1.5,6),M(0x6db843));
    stem.position.y=0.75; g.add(stem);
    const head=new THREE.Group(); head.position.y=1.55;
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.1,10),M(0xa06a2c));
    disc.rotation.x=Math.PI/2 - 0.5; head.add(disc);
    for(let i=0;i<10;i++){
      const pet=new THREE.Mesh(new THREE.SphereGeometry(0.14,6,5),M(0xffd44d));
      const a=Math.PI*2/10*i;
      pet.position.set(Math.cos(a)*0.38, Math.sin(a)*0.34*Math.cos(0.5), Math.sin(a)*0.34*0.45);
      pet.scale.set(1,0.7,0.5);
      head.add(pet);
    }
    g.add(head);
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,5),M(0x7ec850));
    leaf.scale.set(1.4,0.4,0.7); leaf.position.set(0.28,0.7,0); g.add(leaf);
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return g;
}

/* ---- the FARMER: articulated 3D rig ---- */
function makeFarmer(){
  const root=new THREE.Group();
  const body=new THREE.Group(); root.add(body);
  const SEG=18;
  const skin=M(0xffd3ad), skinD=M(0xf7c298);
  const shirt=M(0xff9463), shirtD=M(0xf07f4e);
  const denim=M(0x4a86d4), denimD=M(0x3d72b8);
  const straw=M(0xf6d489), strawD=M(0xe7bf6b);

  /* --- legs: rounded cylinders with chunky round boots (hip pivots) --- */
  function leg(side){
    const hip=new THREE.Group(); hip.position.set(0.21*side,1.02,0);
    const thigh=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.135,0.72,SEG),side>0?denim:denimD);
    thigh.position.y=-0.34; thigh.castShadow=true; hip.add(thigh);
    const cuff=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.165,0.14,SEG),side>0?denimD:M(0x33639f));
    cuff.position.y=-0.68; hip.add(cuff);
    const boot=new THREE.Mesh(new THREE.SphereGeometry(0.19,SEG,12),M(0x8a5a2e));
    boot.scale.set(1,0.75,1.35); boot.position.set(0,-0.82,0.06); boot.castShadow=true; hip.add(boot);
    return hip;
  }
  const legL=leg(1), legR=leg(-1);
  body.add(legL); body.add(legR);

  /* --- torso: one smooth rounded form, denim overalls over a shirt --- */
  const torso=new THREE.Group(); torso.position.y=1.02; body.add(torso);
  const chest=new THREE.Mesh(new THREE.SphereGeometry(0.52,SEG,14),shirt);
  chest.scale.set(0.88,1.06,0.80); chest.position.y=0.52; chest.castShadow=true; torso.add(chest);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.54,SEG,14),denim);
  belly.scale.set(0.90,0.78,0.84); belly.position.y=0.22; belly.castShadow=true; torso.add(belly);
  const bib=new THREE.Mesh(new THREE.SphereGeometry(0.36,SEG,12),denim);
  bib.scale.set(1,0.9,0.42); bib.position.set(0,0.62,0.30); torso.add(bib);
  const pocket=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,9),denimD);
  pocket.scale.set(1,0.75,0.4); pocket.position.set(0,0.56,0.44); torso.add(pocket);
  for(const sd of [-1,1]){
    const strap=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.5,10),denim);
    strap.position.set(0.19*sd,0.92,0.24); strap.rotation.x=-0.42; torso.add(strap);
    const btn=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),M(0xffd44d));
    btn.position.set(0.19*sd,0.78,0.40); torso.add(btn);
  }

  /* --- arms: soft cylinders, slight natural outward bend, round hands (shoulder pivots) --- */
  /* arms hang OUTSIDE the torso and angle outward, so they never clip into the body.
     Short sleeve + bare skin forearm gives strong contrast against the shirt. */
  function arm(side){
    const sh=new THREE.Group(); sh.position.set(0.62*side,0.88,0.02);
    const inner=new THREE.Group(); inner.rotation.z=0.22*side; sh.add(inner);   // outward, not inward
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.175,16,12),side>0?shirt:shirtD);
    cap.scale.set(1,0.92,1); inner.add(cap);                                    // rounded shoulder
    const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.135,0.30,16),side>0?shirt:shirtD);
    sleeve.position.y=-0.19; sleeve.castShadow=true; inner.add(sleeve);
    const hem=new THREE.Mesh(new THREE.TorusGeometry(0.137,0.028,8,16),side>0?shirtD:M(0xdc7345));
    hem.rotation.x=Math.PI/2; hem.position.y=-0.34; inner.add(hem);
    const fore=new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.105,0.40,16),side>0?skin:skinD);
    fore.position.y=-0.55; fore.castShadow=true; inner.add(fore);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.145,16,12),side>0?skin:skinD);
    hand.position.y=-0.78; hand.castShadow=true; inner.add(hand);
    return sh;
  }
  const armL=arm(1), armR=arm(-1);
  torso.add(armL); torso.add(armR);

  /* --- head: big & round (chibi), face clearly visible under a tilted-back hat --- */
  const headG=new THREE.Group(); headG.position.y=1.30; torso.add(headG);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.56,24,18),skin);
  head.castShadow=true; headG.add(head);
  // hair: soft cap + side tufts + low pigtails (visible from behind)
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.575,24,16,0,Math.PI*2,0,Math.PI*0.55),M(0x9a6a3a));
  hair.position.y=0.03; headG.add(hair);
  for(const sd of [-1,1]){
    const tail=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,10),M(0x9a6a3a));
    tail.scale.set(1,1.25,1); tail.position.set(0.42*sd,-0.18,-0.34); headG.add(tail);
    const band=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.06,10),M(0xff5a4e));
    band.position.set(0.40*sd,-0.03,-0.32); band.rotation.z=0.5*sd; headG.add(band);
  }
  // face
  for(const sd of [-1,1]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.065,12,9),M(0x3a2d20));
    eye.position.set(0.19*sd,0.02,0.50); headG.add(eye);
    const glint=new THREE.Mesh(new THREE.SphereGeometry(0.022,8,6),M(0xffffff));
    glint.position.set(0.19*sd+0.02,0.06,0.55); headG.add(glint);
    const cheek=new THREE.Mesh(new THREE.SphereGeometry(0.085,10,8),M(0xffb59e));
    cheek.scale.set(1,0.72,0.5); cheek.position.set(0.33*sd,-0.14,0.42); headG.add(cheek);
  }
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),skinD);
  nose.position.set(0,-0.06,0.56); headG.add(nose);
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.13,0.022,8,16,Math.PI*0.8),M(0xc96e4a));
  smile.position.set(0,-0.19,0.50); smile.rotation.set(0.25,0,Math.PI+Math.PI*0.1); headG.add(smile);
  // straw hat: smaller, tilted back so the face shows from a 45° camera
  const hat=new THREE.Group(); hat.position.y=0.34; hat.rotation.x=0.34; headG.add(hat);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.78,0.07,SEG),straw);
  brim.castShadow=true; hat.add(brim);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(0.42,SEG,12,0,Math.PI*2,0,Math.PI*0.5),straw);
  crown.position.y=0.02; crown.castShadow=true; hat.add(crown);
  const hatBand=new THREE.Mesh(new THREE.CylinderGeometry(0.425,0.435,0.10,SEG),M(0xe0784a));
  hatBand.position.y=0.07; hat.add(hatBand);
  const brimEdge=new THREE.Mesh(new THREE.TorusGeometry(0.75,0.028,8,SEG),strawD);
  brimEdge.rotation.x=Math.PI/2; hat.add(brimEdge);

  root.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return { root, body, legL, legR, armL, armR, torso, headG,
           runPhase:0, heading:0, vel:{x:0,z:0} };
}

/* ---- build the whole world ---- */
const plotWorldPos=i=>{
  const z0=ZONES[0];
  const col=i%3, row=Math.floor(i/3);
  return { x:z0.cx-6+col*6, z:z0.cz-3+row*6 };
};
function buildWorld(){
  // ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w,WORLD.h),
    new THREE.MeshLambertMaterial({map:makeGroundTexture()}));
  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);
  // outer skirt so edges never look cut off
  const skirt=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w*3,WORLD.h*3),M(0x5f9440));
  skirt.rotation.x=-Math.PI/2; skirt.position.y=-0.05;
  skirt.receiveShadow=true;
  scene.add(skirt);

  // farm plots + crops
  for(let i=0;i<FARM.maxPlots;i++){
    const p=plotWorldPos(i);
    const g=new THREE.Group();
    g.position.set(p.x,0,p.z);
    const soil=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.55,4.6),M(0xa5683a));
    soil.position.y=0.27; soil.receiveShadow=true; soil.castShadow=true; g.add(soil);
    const soilTop=new THREE.Mesh(new THREE.BoxGeometry(4.1,0.14,4.1),M(0xc98d5a));
    soilTop.position.y=0.6; g.add(soilTop);
    for(let r=0;r<3;r++){
      const row=new THREE.Mesh(new THREE.BoxGeometry(4.1,0.06,0.28),M(0xb0713e));
      row.position.set(0,0.68,-1.2+r*1.2); g.add(row);
    }
    const lock=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,0.3),M(0x8a7a64));
    lock.position.y=1.35; lock.visible=false; g.add(lock);
    const crops={};
    for(const kind of FARM.crops){
      const c=makeCrop(kind);
      c.position.y=0.65; c.visible=false;
      g.add(c); crops[kind]=c;
    }
    g.userData={type:'plot',idx:i,lock,crops};
    scene.add(g);
    plots3D.push(g);
  }
  // farm fence
  ringFence(ZONES[0],10);
  // meadow fence + gate lock sign handled by shop
  ringFence(ZONES[1],10);
  // construction site
  const b=ZONES[2];
  const base=new THREE.Mesh(new THREE.BoxGeometry(7,1,5),M(0xd9cdb6));
  base.position.set(b.cx,0.5,b.cz); base.castShadow=true; scene.add(base);
  const tower=new THREE.Mesh(new THREE.BoxGeometry(1,7,1),M(0xffb930));

function ringFence(zone){
  const step=2.2, railM=M(0xdeb887), gate=3;
  function rail(x1,z1,x2,z2){
    const len=Math.hypot(x2-x1,z2-z1);
    for(const y of [0.42,0.78]){
      const r=new THREE.Mesh(new THREE.BoxGeometry(len,0.09,0.09),railM);
      r.position.set((x1+x2)/2,y,(z1+z2)/2);
      r.rotation.y=Math.atan2(-(z2-z1),x2-x1);
      r.castShadow=true;
      scene.add(r);
    }
  }
  for(let x=-zone.hx;x<=zone.hx;x+=step){
    for(const zSide of [-zone.hz,zone.hz]){
      if(zSide>0 && Math.abs(x)<gate) continue;   // south gate opening
      const p=makeFencePost(); p.position.set(zone.cx+x,0,zone.cz+zSide); scene.add(p);
    }
  }
  for(let z=-zone.hz;z<=zone.hz;z+=step){
    for(const xSide of [-zone.hx,zone.hx]){
      const p=makeFencePost(); p.position.set(zone.cx+xSide,0,zone.cz+z); scene.add(p);
    }
  }
  // continuous rails per side (split south side around the gate)
  rail(zone.cx-zone.hx, zone.cz-zone.hz, zone.cx+zone.hx, zone.cz-zone.hz);
  rail(zone.cx-zone.hx, zone.cz+zone.hz, zone.cx-gate,    zone.cz+zone.hz);
  rail(zone.cx+gate,    zone.cz+zone.hz, zone.cx+zone.hx, zone.cz+zone.hz);
  rail(zone.cx-zone.hx, zone.cz-zone.hz, zone.cx-zone.hx, zone.cz+zone.hz);
  rail(zone.cx+zone.hx, zone.cz-zone.hz, zone.cx+zone.hx, zone.cz+zone.hz);
}

const _v=new THREE.Vector3();
function worldToScreen(x,y,z){

/* =====================================================================
   CHARACTER CONTROLLER — joystick, real 3D turn + procedural run
   ===================================================================== */
const WALK_SPEED=8.5; // world units/s
const joy={active:false,baseX:0,baseY:0,vx:0,vy:0,mag:0,startT:0,moved:false};
const JOY_R=48;
function initJoystick(){
  const wrap=$('#sceneWrap');
  const ring=$('#joyRing')||(()=>{const r=document.createElement('div');r.id='joyRing';wrap.appendChild(r);return r;})();
  const nub=$('#joyNub')||(()=>{const n=document.createElement('div');n.id='joyNub';wrap.appendChild(n);return n;})();

  wrap.addEventListener('pointerdown',e=>{
    const r=wrap.getBoundingClientRect();
    joy.active=true; joy.moved=false; joy.startT=performance.now();
    joy.baseX=e.clientX-r.left; joy.baseY=e.clientY-r.top;
    joy.vx=0;joy.vy=0;joy.mag=0;
    wrap.setPointerCapture&&wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',e=>{
    if(!joy.active)return;
    const r=wrap.getBoundingClientRect();
    const dx=(e.clientX-r.left)-joy.baseX, dy=(e.clientY-r.top)-joy.baseY;
    const dist=Math.hypot(dx,dy);
    if(!joy.moved && dist>12){
      joy.moved=true;
      ring.style.left=joy.baseX+'px'; ring.style.top=joy.baseY+'px'; ring.style.display='block';
      nub.style.display='block';
    }
    if(joy.moved){
      const d=dist||1;
      const capped=Math.min(JOY_R,dist);
      joy.vx=dx/d; joy.vy=dy/d; joy.mag=capped/JOY_R;
      nub.style.left=(joy.baseX+joy.vx*capped)+'px';
      nub.style.top=(joy.baseY+joy.vy*capped)+'px';
    }
  });
  const end=(e)=>{
    const wasTap = joy.active && !joy.moved && (performance.now()-joy.startT)<260;
    joy.active=false; joy.mag=0;
    ring.style.display='none'; nub.style.display='none';
    if(wasTap && e && e.clientX!==undefined) tapWorld(e);
  };
  wrap.addEventListener('pointerup',end);
  wrap.addEventListener('pointercancel',()=>end(null));
}

/* quick tap → raycast: harvest crops / shear sheep */
function tapWorld(e){
  const wrap=$('#sceneWrap').getBoundingClientRect();
  tapV.x=((e.clientX-wrap.left)/wrap.width)*2-1;
  tapV.y=-((e.clientY-wrap.top)/wrap.height)*2+1;
  ray.setFromCamera(tapV,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o && !o.userData.type) o=o.parent;
    if(!o) continue;
    if(o.userData.type==='plot'){
      const i=o.userData.idx;
      if(i<S.unlockedPlots && S.plots[i].ready){ harvest(i); return; }
    }
    if(o.userData.type==='sheep'){
      const i=o.userData.idx;
      if(S.sheep[i] && S.sheep[i].ready){ collectWool(i); return; }
    }
  }
}

function shortestAngle(a){ return ((a+Math.PI*3)%(Math.PI*2))-Math.PI; }

function updateCharacter(dt,t){
  const R=FarmerRig;
  // screen joystick → world dir (camera looks north: screen up = -z, right = +x)
  const wantVx=(joy.active&&joy.moved&&joy.mag>0.12)?joy.vx*WALK_SPEED*joy.mag:0;
  const wantVz=(joy.active&&joy.moved&&joy.mag>0.12)?joy.vy*WALK_SPEED*joy.mag:0;
  const accel=Math.min(1, dt*((wantVx||wantVz)?10:16));
  R.vel.x+=(wantVx-R.vel.x)*accel;
  R.vel.z+=(wantVz-R.vel.z)*accel;
  const speed=Math.hypot(R.vel.x,R.vel.z);

  R.root.position.x=Math.max(-WORLD.w/2+2,Math.min(WORLD.w/2-2,R.root.position.x+R.vel.x*dt));
  R.root.position.z=Math.max(-WORLD.h/2+2,Math.min(WORLD.h/2-2,R.root.position.z+R.vel.z*dt));

  // real 3D turn toward movement
  if(speed>1.2){
    const targetH=Math.atan2(R.vel.x,R.vel.z);
    R.heading+=shortestAngle(targetH-R.heading)*Math.min(1,dt*10);
  }
  R.root.rotation.y=R.heading;

  // procedural run cycle: limbs swing through space, stride scales with speed
  const k=Math.min(1,speed/WALK_SPEED);
  R.runPhase+=dt*(3.5+9.5*k);
  const swing=Math.sin(R.runPhase)*(0.10+0.92*k);
  R.legL.rotation.x=swing;
  R.legR.rotation.x=-swing;
  R.armL.rotation.x=-swing*0.78;
  R.armR.rotation.x=swing*0.78;
  R.armL.rotation.z=0.10*k;     // arms swing slightly clear of the body while running
  R.armR.rotation.z=-0.10*k;
  R.body.position.y=Math.abs(Math.sin(R.runPhase))*0.12*k;
  R.body.rotation.x=0.12*k;                       // lean into the run
  R.body.rotation.z=Math.sin(R.runPhase)*0.04*k;  // subtle hip sway
  R.headG.rotation.x=-0.10*k;                     // head stays up while leaning
  // idle breathing
  R.torso.scale.y=1+Math.sin(t*2.1)*0.02*(1-k);
  R.headG.rotation.z=Math.sin(t*1.3)*0.04*(1-k);
}

/* sheep wander + crop ready wobble + clouds */
function updateWorldLife(dt,t){
  sheep3D.forEach((sh,i)=>{
    sh.userData.wanderT-=dt;
    if(sh.userData.wanderT<=0){
      sh.userData.wanderT=2.5+Math.random()*3;
      const z=ZONES[1];
      sh.userData.tgt={x:z.cx+(Math.random()-0.5)*z.hx*1.5, z:z.cz+(Math.random()-0.5)*z.hz*1.5};
    }
    const dx=sh.userData.tgt.x-sh.position.x, dz=sh.userData.tgt.z-sh.position.z;
    const d=Math.hypot(dx,dz);
    if(d>0.3){
      sh.position.x+=dx/d*1.1*dt;
      sh.position.z+=dz/d*1.1*dt;
      sh.rotation.y+=shortestAngle(Math.atan2(dx,dz)+Math.PI/2-sh.rotation.y)*Math.min(1,dt*4);
      sh.position.y=Math.abs(Math.sin(t*7+i))*0.07;
    } else sh.position.y*=0.9;
    const mark=sh.userData.marker;
    if(mark.visible){ mark.position.y=2.2+Math.sin(t*4+i)*0.18; mark.rotation.y+=dt*2; }
  });
  plots3D.forEach((g,i)=>{
    if(i>=S.unlockedPlots) return;
    const kind=FARM.crops[S.cropTier];
    const c=g.userData.crops[kind];
    if(c.visible && S.plots[i].ready){
      c.rotation.z=Math.sin(t*5+i)*0.09;
      const pulse=1+Math.sin(t*5+i)*0.05;
      c.scale.set(pulse,pulse,pulse);
    } else c.rotation.z*=0.9;
  });
  clouds3D.forEach(c=>{
    c.position.x+=c.userData.speed*dt;
    if(c.position.x>70) c.position.x=-70;
  });
  butterflies.forEach(b=>{
    const u=b.userData;
    u.t+=dt; u.wt-=dt;
    if(u.wt<=0){ u.wt=3+Math.random()*4;
      u.tgt={x:(Math.random()-0.5)*70, z:(Math.random()-0.5)*46}; }
    const flap=Math.sin(u.t*18)*0.9;
    u.w1.rotation.y=flap; u.w2.rotation.y=-flap;
    const dx=u.tgt.x-b.position.x, dz=u.tgt.z-b.position.z;
    const d=Math.hypot(dx,dz)||1;
    b.position.x+=dx/d*1.6*dt;
    b.position.z+=dz/d*1.6*dt;
    b.position.y=1.5+Math.sin(u.t*2.2)*0.45;
    b.rotation.y=Math.atan2(dx,dz);
  });
}

   sub:()=>`${S.sheep.length}/${MEADOW.costs.sheep.max} sheep`,
   maxed:()=>S.sheep.length>=MEADOW.costs.sheep.max,cost:()=>meadowCost('sheep'),
   locked:()=>!S.meadowOpen,
   buy:()=>{S.sheep.push({progress:0,ready:false});spawnSheep3D();farmerSay('Welcome, sheep! 🐑');}},
  {key:'wool',name:'Wool Quality',icon:'🧶',
   sub:()=>`+50% value · Lv ${S.meadowLv.wool}`,
   maxed:()=>S.meadowLv.wool>=MEADOW.costs.wool.max,cost:()=>meadowCost('wool'),
   locked:()=>!S.meadowOpen,
   buy:()=>{S.meadowLv.wool++;}},
  {key:'shear',name:'Quick Shears',icon:'✂️',
   sub:()=>`Faster wool · Lv ${S.meadowLv.shear}`,
   maxed:()=>S.meadowLv.shear>=MEADOW.costs.shear.max,cost:()=>meadowCost('shear'),
   locked:()=>!S.meadowOpen,
   buy:()=>{S.meadowLv.shear++;}}
];
function renderShop(){
  $('#shopTitle').textContent=S.zone===1?'🐑 MEADOW UPGRADES':(S.zone===2?'🏗️ COMING SOON':'🌾 FARM UPGRADES');
  const wrap=$('#upgrades');wrap.innerHTML='';
  if(S.zone===2)return;
  (S.zone===1?MEADOW_SHOP:FARM_SHOP).forEach(item=>{
    if(item.hidden&&item.hidden())return;
    const b=document.createElement('button');
    b.className='upg';
    b.innerHTML=`<div class="icon">${item.icon}</div>
      <div class="info"><div class="name">${item.name}</div><div class="lvl"></div></div>
      <div class="cost"></div>`;
    b.addEventListener('pointerdown',()=>{
      if(item.locked&&item.locked()){shake(b);return;}
      if(item.maxed())return;
      const cost=item.cost();
      if(S.coins<cost){shake(b);farmerSay('Not enough coins!');return;}
      S.coins-=cost;item.buy();
      chirp(440);setTimeout(()=>chirp(560),90);
      renderAll();save();
    });
    b._item=item;
    wrap.appendChild(b);
  });
  updateShopButtons();
}
function updateShopButtons(){
  document.querySelectorAll('.upg').forEach(b=>{
    const item=b._item;if(!item)return;
    const maxed=item.maxed(),cost=item.cost();
    const lockedNow=item.locked&&item.locked();
    b.querySelector('.lvl').textContent=lockedNow?'Unlock the Meadow first':item.sub();
    b.querySelector('.cost').innerHTML=maxed?'MAX ✓':
      `<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10" fill="#f5a623"/><circle cx="12" cy="12" r="7" fill="#ffd44d"/></svg>${fmt(cost)}`;
    b.classList.toggle('maxed',maxed);
    b.classList.toggle('cant',lockedNow||(!maxed&&S.coins<cost));
  });
}
function buildRewardsDOM(){
  const bar=$('#rewardsBar');bar.innerHTML='';
  Object.keys(AD_DEFS).forEach(key=>{
    const b=document.createElement('button');
    b.className='rw';b.dataset.key=key;
    b.innerHTML=`<span class="adTag">📺 AD</span><span class="rwIcon">${AD_DEFS[key].icon}</span>
      <span class="rwName">${AD_DEFS[key].name}</span><span class="rwSub"></span>`;
    b.addEventListener('pointerdown',()=>tryAdReward(key,b));
    bar.appendChild(b);
  });
}

/* ===================== DOM RENDER (header/tasks/rewards) ===================== */
function renderHeader(){
  $('#coinCount').textContent=fmt(S.coins);
  $('#levelName').textContent=`🌱 Farm Lv ${S.farmLevel}`;
  const into=S.tasksDone%TASKS_PER_LEVEL;
  $('#lvlNums').textContent=`${into} / ${TASKS_PER_LEVEL} tasks`;
  $('#lvlFill').style.width=(into/TASKS_PER_LEVEL*100)+'%';
  updateShopButtons();
}
function renderTasks(){
  const strip=$('#taskStrip');strip.innerHTML='';
  activeTasks().forEach(({def},slot)=>{
    const prog=taskProgress(def),target=taskTarget(def),done=taskComplete(def);
    const d=document.createElement('div');
    d.className='task'+(done?' done':'');
    d.innerHTML=`<div class="tTitle"><span class="tIcon">${def.icon}</span><span>${def.title}</span></div>
      ${done
        ?`<div class="claimRow">
           <button class="claimBtn" data-m="1">+${fmt(taskReward(def))}</button>
           <button class="claimBtn x2" data-m="2">📺×2</button>
         </div>`
        :`<div class="tBar"><div class="tFill" style="width:${prog/target*100}%"></div></div>
          <div class="tNums">${def.type==='counter'?fmt(prog)+' / '+fmt(target):'In progress…'}</div>`}`;
    if(done){
      d.querySelector('[data-m="1"]').addEventListener('pointerdown',()=>claimTask(slot,1));
      d.querySelector('[data-m="2"]').addEventListener('pointerdown',()=>AdManager.show(()=>{registerAdWatch();claimTask(slot,2);}));
    }
    strip.appendChild(d);
  });
}
function renderRewards(){
  document.querySelectorAll('.rw').forEach(b=>{
    const key=b.dataset.key,ready=adReady(key);
    b.classList.toggle('cool',!ready);
    const sub=b.querySelector('.rwSub');
    if(ready)sub.textContent=AD_DEFS[key].desc();
    else if((S.adCount[key]||0)>=AD_DEFS[key].cap)sub.textContent='Back tomorrow!';
    else if(key==='wool'&&(!S.meadowOpen||S.sheep.length===0))sub.textContent='Needs sheep';
    else{
      const left=Math.ceil(AD_DEFS[key].cd-(now()-(S.adLast[key]||0))/1000);
      sub.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    }
  });
  const br=$('#boostRow');br.innerHTML='';
  if(boostOn()){const s2=Math.ceil((S.boostUntil-now())/1000);
    br.insertAdjacentHTML('beforeend',`<span class="chip boost">☀️ 2× ${Math.floor(s2/60)}:${String(s2%60).padStart(2,'0')}</span>`);}
  if(superBotOn()){const s2=Math.ceil((S.superBotUntil-now())/1000);
    br.insertAdjacentHTML('beforeend',`<span class="chip bot">🤖 ${Math.floor(s2/60)}:${String(s2%60).padStart(2,'0')}</span>`);}
}
function renderAll(){renderHeader();renderTasks();renderRewards();sync3DFarm();sync3DMeadow();}
function fmt(n){
  if(n>=1e6)return (n/1e6).toFixed(1)+'M';
  if(n>=1e4)return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}

/* ===================== DOM FX (unchanged juice) ===================== */
function flyCoin(x,y){
  const c=document.createElement('div');c.className='flyCoin';
  c.innerHTML=`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5a623"/><circle cx="12" cy="12" r="7" fill="#ffd44d"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#c98a00">$</text></svg>`;
  c.style.left=(x-13)+'px';c.style.top=(y-13)+'px';
  document.body.appendChild(c);
  const t=$('#coinBox').getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    c.style.left=(t.left+t.width/2-13)+'px';c.style.top=(t.top+t.height/2-13)+'px';
    c.style.transform='scale(0.5)';c.style.opacity='0.4';
  }));
  setTimeout(()=>{c.remove();bump($('#coinBox'));},620);
}
function coinFountain(x,y,count){
  for(let i=0;i<count;i++) setTimeout(()=>flyCoin(x+(Math.random()-0.5)*90,y+(Math.random()-0.5)*40),i*70);
}
function sparkBurst(x,y){
  for(let i=0;i<6;i++){
    const s2=document.createElement('div');s2.className='spark';s2.textContent=['✨','⭐','🌟'][i%3];
    const a=Math.random()*Math.PI*2,d=26+Math.random()*32;
    s2.style.left=x+'px';s2.style.top=y+'px';
    s2.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s2.style.setProperty('--dy',(Math.sin(a)*d-18)+'px');
    document.body.appendChild(s2);
    setTimeout(()=>s2.remove(),650);
  }
}
function fireworks(){
  const colors=['#ffd44d','#ff8b3d','#5cbf4f','#ff5a4e','#6ab7e8','#b47ff0'];
  for(let burst=0;burst<4;burst++){
    setTimeout(()=>{
      const cx=innerWidth*(0.2+Math.random()*0.6), cy=innerHeight*(0.2+Math.random()*0.3);
      for(let i=0;i<14;i++){
        const d=document.createElement('div');d.className='fireworkDot';
        d.style.background=colors[i%colors.length];
        d.style.left=cx+'px';d.style.top=cy+'px';
        document.body.appendChild(d);
        const a=Math.PI*2/14*i, dist=50+Math.random()*70;
        d.animate([
          {transform:'translate(0,0) scale(1)',opacity:1},
          {transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist+30}px) scale(0.3)`,opacity:0}
        ],{duration:800+Math.random()*400,easing:'cubic-bezier(.1,.6,.4,1)'}).onfinish=()=>d.remove();
      }
      chirp(500+burst*120,'triangle',0.06);
    },burst*280);
  }
  confetti();
}
function flash(){
  const f=document.createElement('div');f.className='flash';
  document.body.appendChild(f);setTimeout(()=>f.remove(),520);
}
function confetti(){
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const conf=document.createElement('div');
      conf.style.cssText=`position:fixed;left:${innerWidth*Math.random()}px;top:-20px;width:10px;height:10px;z-index:99;border-radius:3px;
        background:${['#ffd44d','#ff8b3d','#5cbf4f','#ff5a4e','#6ab7e8','#b47ff0'][i%6]};pointer-events:none;`;
      document.body.appendChild(conf);
      conf.animate([
        {transform:'translateY(0) rotate(0)',opacity:1},
        {transform:`translateY(${innerHeight+40}px) rotate(${360+Math.random()*360}deg)`,opacity:1}
      ],{duration:1800+Math.random()*1200,easing:'ease-in'}).onfinish=()=>conf.remove();
    },i*55);
  }
}
function bump(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:180});}
function popText(x,y,txt,color){
  const t=document.createElement('div');t.className='popText';t.textContent=txt;
  t.style.left=(x-10)+'px';t.style.top=(y-30)+'px';t.style.color=color||'#fff';
  document.body.appendChild(t);setTimeout(()=>t.remove(),800);
}
function shake(el){
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});
  chirp(160,'square',0.05);
}
let AC=null;
function chirp(freq,type='sine',vol=0.07){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;
    o.frequency.exponentialRampToValueAtTime(freq*1.6,AC.currentTime+0.09);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.14);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.15);
  }catch(e){}
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT=performance.now(),uiTimer=0,elapsed=0;
function tick(nowMs){
  const dt=Math.min(0.1,(nowMs-lastT)/1000);
  lastT=nowMs; elapsed+=dt;
  if(S&&FarmerRig){
    // economy simulation
    const gt=growTime();
    let changed=false;
    for(let i=0;i<S.unlockedPlots;i++){
      const p=S.plots[i];
      if(!p.ready){p.progress+=dt/gt;if(p.progress>=1){p.progress=1;p.ready=true;}changed=true;}
    }
    const botLvl=superBotOn()?99:S.upgLevels.auto;
    if(botLvl>0){
      S.autoTimer-=dt;
      if(S.autoTimer<=0){
        S.autoTimer=superBotOn()?0.5:Math.max(0.8,4-S.upgLevels.auto);
        const idx=S.plots.findIndex((p,i)=>i<S.unlockedPlots&&p.ready);
        if(idx>=0) harvest(idx);
      }
    }
    if(S.meadowOpen){
      const wt=woolTime();
      S.sheep.forEach(sh=>{
        if(!sh.ready){sh.progress+=dt/wt;if(sh.progress>=1){sh.progress=1;sh.ready=true;}changed=true;}
      });
    }
    // 3D world
    updateCharacter(dt,elapsed);
    updateCamera(dt);
    updateWorldLife(dt,elapsed);
    updateHUDWorld();
    uiTimer+=dt;
    if(changed||uiTimer>0.5){uiTimer=0;sync3DFarm();sync3DMeadow();renderRewards();}
    renderer.render(scene,camera);
  }
  requestAnimationFrame(tick);
}

/* ===================== BOOT ===================== */
const hasSave=load();
if(!hasSave){ S=newState(); }
initThree();
buildWorld();
initJoystick();
buildRewardsDOM();
renderShop();
renderAll();
if(hasSave){ offlineWelcome(); farmerSay('Welcome back! 👋',2000); }
else { save(); farmerSay('Let’s grow! 🌱',2200); }
if(S.meadowOpen) document.querySelector('[data-dot="2"]').classList.remove('lock');
requestAnimationFrame(tick);
</script>
